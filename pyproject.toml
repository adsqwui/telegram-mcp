[project]
name = "telegram-mcp"
version = "1.0.0"
description = "MCP server that gives an AI agent a Telegram user account: chats, groups, channels, media"
requires-python = ">=3.11,<3.14"
license = "MIT"
readme = "README.md"
dependencies = [
    "mcp==2.3.0",
    "telethon==1.46.0",
    "cryptg>=0.5",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "qrcode>=8.0",
    "faster-whisper>=1.1",
    "av>=12,<16",  # av 16+ dropped the metadata_errors argument faster-whisper passes
    "pypdf>=5.0",
]

[project.scripts]
telegram-mcp = "telegram_mcp.server:main"
telegram-mcp-login = "telegram_mcp.login:main"
telegram-mcp-model = "telegram_mcp.transcribe:download_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
